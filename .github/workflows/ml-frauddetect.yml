name: Fraud Detect Pipeline

on:
    push:
        branches: [main]

jobs:
  build-and-push:
    runs-on: self-hosted
    permissions:
      contents: write  # Required to push commits
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}  # Use built-in token
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
          pip install -r requirements.txt
    
    - name: Check Python
      run: |
          python --version
    
    - name: Check application
      run: |
          python -c "from app.main import app; print('Application loaded successfully')"
    
    - name: Build Docker image
      run: |
          docker build -t fraud-detection:${{ github.run_number }} .

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Tag Docker image
      run: |
        docker tag fraud-detection:${{ github.run_number }} \
        ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/fraud-detection:${{ github.run_number }}

    - name: Push Docker image
      run: |
        docker push \
        ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/fraud-detection:${{ github.run_number }}
    
    - name: Verify Kind cluster
      run: |
        kind get clusters
        kubectl config use-context kind-churn-model
        kubectl get nodes
    
    - name: Verify KServe
      run: |
        kubectl get pods -A
        kubectl get crd | grep serving.kserve.io

    - name: Create ECR pull secret
      run: |
        kubectl create secret docker-registry ecr-secret \
        --docker-server=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com \
        --docker-username=AWS \
        --docker-password="$(aws ecr get-login-password --region us-east-1)" \
        --docker-email=devops@example.com \
        --dry-run=client \
        -o yaml | kubectl apply -f -
    
    - name: Deploy fraud detection
      run: |
        sed -i "s|IMAGE_PLACEHOLDER|${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/fraud-detection:${{ github.run_number }}|g" k8s/deployment.yaml
        kubectl apply -f k8s/deployment.yaml
    
    - name: Verify deployment
      run: |
       kubectl get deployment fraud-detection
       kubectl get pods -l app=fraud-detection
    
    

    
    
    